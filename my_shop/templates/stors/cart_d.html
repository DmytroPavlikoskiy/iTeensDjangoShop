{% extends "base.html" %}

{% block content %}
<h2>Ваша Корзина</h2>

{% for item in cart %}
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 15px 10px;">{{ item.product.name }}</td>
                <td>{{ item.price }}</td>
                
                <td>
                    <form action="{% url 'cart_update' item.product.id %}" method="post" style="display: flex; align-items: center; gap: 5px;">
                        {% csrf_token %}
                        <input type="number" 
                               name="quantity" 
                               value="{{ item.quantity }}" 
                               min="0" 
                               style="width: 50px; text-align: center; padding: 5px;"
                               onchange="this.form.submit()">
                        </form>
                </td>
                
                <td>{{ item.total_price }}</td>
                
                <td>
                    <form action="{% url 'cart_remove' item.product.id %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" style="background: none; border: none; color: red; cursor: pointer; padding: 0; text-decoration: underline;">
                            Удалить
                        </button>
                    </form>
                </td>
                
            </tr>
            {% endfor %}

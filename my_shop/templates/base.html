{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWERGEN - Energy Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #121214; --bg-card: #1e1e24; --primary: #2d8cf0;
            --text-main: #ffffff; --text-muted: #a1a1aa; --accent-green: #2ecc71;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        header { padding: 20px 0; background: rgba(18, 18, 20, 0.95); position: sticky; top: 0; z-index: 1000; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; }
        .logo span { color: var(--accent-green); }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
        .cart-icon { position: relative; color: #fff; font-size: 20px; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background: red; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* General Styles */
        .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .section-title { font-size: 24px; margin: 40px 0 20px; }
    </style>
</head>
<body>
    <header>
        <div class="container nav-wrapper">
            <a href="{% url 'product_list' %}" class="logo">POWER<span>GEN</span></a>
            <ul class="nav-links">
                <li><a href="{% url 'product_list' %}">Products</a></li>
                <li><a href="#">Solutions</a></li>
                <li><a href="#">Support</a></li>
            </ul>
            <a href="{% url 'cart_detail' %}" class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">{{ cart|length }}</span>
            </a>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer style="padding: 40px 0; text-align: center; color: var(--text-muted); border-top: 1px solid #222; margin-top: 50px;">
        <div class="container">© 2025 POWERGEN Industrial</div>
    </footer>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('add-to-cart-btn')) {
                e.preventDefault();
                const url = e.target.getAttribute('data-url');
                fetch(url, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': '{{ csrf_token }}' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('cart-count').innerText = data.cart_total_items;
                        e.target.innerText = 'ADDED!';
                        e.target.style.background = '#2ecc71';
                        setTimeout(() => { e.target.innerText = 'ADD TO CART'; e.target.style.background = ''; }, 2000);
                    }
                });
            }
        });
    </script>
</body>
</html>

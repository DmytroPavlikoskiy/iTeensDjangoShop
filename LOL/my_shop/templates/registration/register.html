{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Регистрация</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                {{ field }}
                {% if field.errors %}
                    <p class="error-text">{{ field.errors }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn primary-btn">Создать аккаунт</button>
    </form>
    
    <p class="form-footer">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}

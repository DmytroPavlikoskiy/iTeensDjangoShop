{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop Pro</title>

    <!-- Твій існуючий CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>

<!-- 🔴 ЄДИНА ЗМІНА — клас -->
<body class="powergen-bg">

<nav class="navbar">
    <a href="/" class="logo">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
    </a>

    <div class="nav-links">
        <a href="{% url 'product_list' %}">Каталог</a>
        <a href="{% url 'cart_detail' %}">
            Корзина
            <span class="badge">{{ request.session.cart|length }}</span>
        </a>

        {% if user.is_authenticated %}
            <a href="#">{{ user.username }}</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                        style="background:none;border:none;cursor:pointer;color:inherit;">
                    Вийти
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Вхід</a>
        {% endif %}
    </div>
</nav>

{% if messages %}
<div class="messages-container" style="position:fixed; top:20px; right:20px;">
    {% for message in messages %}
        <div class="alert"
             style="background:#fff;padding:15px;
                    border-left:5px solid #3b82f6;
                    margin-bottom:10px;
                    box-shadow:0 5px 15px rgba(0,0,0,.1);">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>


services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: backend_my_shop
    command: gunicorn my_shop.wsgi:application --bind 0.0.0.0:8000
    # command: sh -c "python manage.py collectstatic --noinput && chmod -R 755 /app/staticfiles && gunicorn my_shop.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./my_shop:/app 
      # - static_volume:/app/staticfiles
      # - media_volume:/app/media
    working_dir: /app
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always


  db:
    image: postgres:15
    container_name: postgres_my_shop
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  # nginx:
  #   image: nginx:latest
  #   container_name: nginx_my_shop
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  #     - static_volume:/app/staticfiles
  #     - media_volume:/app/media
  #   depends_on:
  #     - backend
  #   restart: always

volumes:
  postgres_data:
